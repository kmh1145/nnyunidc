services:
  app:
    build: .
    container_name: nnyunidc
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://nnyunidc:${DB_PASSWORD:-nnyunidc}@db:5432/nnyunidc
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=change-this-to-a-random-32-char-string
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    container_name: nnyunidc-db
    restart: always
    environment:
      - POSTGRES_USER=nnyunidc
      - POSTGRES_PASSWORD=nnyunidc
      - POSTGRES_DB=nnyunidc
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nnyunidc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
